    // --- SINTETIZADOR DE AUDIO (Web Audio API) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playPop() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playSwoosh() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
      playFanfare() {
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const startTime = this.ctx.currentTime + idx * 0.1;
          gain.gain.setValueAtTime(0, startTime);
          gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.4);
        });
      }
    }

            explanation: "Identificamos término con radical."
          },
          {
            stepTitle: "3. Sustitución",
            katex: "(3\\sqrt{2}x)^2 + 2(3\\sqrt{2}x)(4) + (4)^2",
            explanation: "Escribimos la expresión completa."
          },
          {
            stepTitle: "4. Cálculo del Cuadrado Irracional",
            katex: "(3\\sqrt{2}x)^2 = 3^2 \\cdot (\\sqrt{2})^2 \\cdot x^2 = 9 \\cdot 2 \\cdot x^2 = 18x^2",
            explanation: "Aplicamos leyes de exponentes: 9 × 2 = 18."
          },
          {
            stepTitle: "5. Multiplicación Central",
            katex: "2 \\cdot (3\\sqrt{2}x) \\cdot 4 = (2 \\cdot 3 \\cdot 4)\\sqrt{2}x = 24\\sqrt{2}x",
            explanation: "Multiplicamos números enteros: 2 × 3 × 4 = 24."
          },
          {
            stepTitle: "6. Resultado Final",
            katex: "18x^2 + 24\\sqrt{2}x + 16",
            explanation: "Calculamos 4^2 = 16. Obtenemos 18x^2 + 24√2x + 16."
          }
        ]
      },
      {
        id: 11,
        title: "Reto 11: Identidad de Legendre (Suma de Cuadrados)",
        originalLabel: "Ejercicio 6.a",
        statement: "(x + 2)^2 + (x - 2)^2",
        formulaRef: "(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)",
        formulaKatex: "(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)",
        variables: [
          { name: "a", value: "x" },
          { name: "b", value: "2" }
        ],
        steps: [
          {
            stepTitle: "1. Identidad de Legendre",
            katex: "(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)",
            explanation: "En lugar de desarrollar ambos binomios por separado, la 1ª Identidad de Legendre nos simplifica directamente el trabajo."
          },
          {
            stepTitle: "2. Identificación de Componentes",
            katex: "a = x \\quad \\text{y} \\quad b = 2",
            explanation: "Reconocemos que ambas estructuras comparten los mismos términos a y b."
          },
          {
            stepTitle: "3. Aplicación Directa de Legendre",
            katex: "2 \\cdot \\left[ (x)^2 + (2)^2 \\right]",
            explanation: "Reemplazamos en 2(a^2 + b^2)."
          },
          {
            stepTitle: "4. Cálculo Interno",
            katex: "2 \\cdot (x^2 + 4)",
            explanation: "Calculamos el cuadrado de 2: 2^2 = 4."
          },
          {
            stepTitle: "5. Distributiva Final",
            katex: "2x^2 + 8",
            explanation: "Multiplicamos el 2 por cada término dentro del paréntesis: 2·x^2 + 2·4 = 2x^2 + 8."
          },
          {
            stepTitle: "6. Resultado Simplificado",
            katex: "(x + 2)^2 + (x - 2)^2 = 2x^2 + 8",
            explanation: "¡Listo! La respuesta simplificada al máximo es 2x^2 + 8."
          }
        ]
      },
      {
        id: 12,
        title: "Reto 12: Identidad de Legendre con Coeficientes",
        originalLabel: "Ejercicio 6.b",
        statement: "(2x + 3)^2 + (2x - 3)^2",
        formulaRef: "(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)",
        formulaKatex: "(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)",
        variables: [
          { name: "a", value: "2x" },
          { name: "b", value: "3" }
        ],
        steps: [
          {
            stepTitle: "1. Identidad a Utilizar",
            katex: "(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)",
            explanation: "Primera Identidad de Legendre."
          },
          {
            stepTitle: "2. Términos",
            katex: "a = 2x, \\quad b = 3",
            explanation: "Notar que 'a' equivale a '2x'."
          },
          {
            stepTitle: "3. Sustitución en la Identidad",
            katex: "2 \\cdot \\left[ (2x)^2 + (3)^2 \\right]",
            explanation: "Envolvemos (2x) entre paréntesis."
          },
          {
            stepTitle: "4. Desarrollo de Cuadrados Internos",
            katex: "2 \\cdot \\left[ 4x^2 + 9 \\right]",
            explanation: "Calculamos (2x)^2 = 4x^2 y 3^2 = 9."
          },
          {
            stepTitle: "5. Propiedad Distributiva",
            katex: "2(4x^2) + 2(9)",
            explanation: "Distribuimos el factor 2."
          },
          {
            stepTitle: "6. Solución Definitiva",
            katex: "8x^2 + 18",
            explanation: "Obtenemos 8x^2 + 18."
          }
        ]
      }
    ];

    // --- COMPONENTE TARJETA DE FÓRMULA INTERACTIVA ---
    const InteractiveFormulaCard = ({ title, formula, description }) => {
      const [isOpen, setIsOpen] = useState(false);

      const toggle = () => {
        sfx.playPop();
        setIsOpen(!isOpen);
      };

      return (
        <div className="glass-panel rounded-xl overflow-hidden transition-all duration-300 border border-indigo-500/30 hover:border-indigo-500/60 shadow-lg">
          <button
            onClick={toggle}
            className="w-full p-4 text-left flex items-center justify-between bg-slate-800/80 hover:bg-slate-700/80 transition-colors"
          >
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-indigo-600/30 border border-indigo-400/40 flex items-center justify-center text-indigo-300 font-bold">
                ƒ
              </div>
              <span className="font-bold text-slate-200">{title}</span>
            </div>
            <span className="text-indigo-400 font-bold text-sm bg-indigo-950/60 px-3 py-1 rounded-full border border-indigo-500/30">
              {isOpen ? 'Ocultar' : 'Ver Regla'}
            </span>
          </button>
          
          {isOpen && (
            <div className="p-4 bg-slate-900/90 border-t border-slate-700/50 space-y-3 animate-fadeIn">
              <div className="p-3 bg-slate-950/80 rounded-lg text-center border border-indigo-500/20">
                <MathTex math={formula} inline={false} className="text-xl text-indigo-300 font-semibold" />
              </div>
              <p className="text-xs text-slate-300 leading-relaxed">
                {description}
              </p>
            </div>
          )}
        </div>
      );
    };

    // --- ROBOT ASISTENTE ANIMADO ("TuProfe20") ---
    const RobotAssistant = ({ currentStepData, totalSteps, currentStepIndex }) => {
      return (
        <div className="glass-panel rounded-2xl p-5 shadow-2xl relative overflow-hidden border border-indigo-500/40 flex flex-col md:flex-row items-center gap-5">
          {/* Fondo decorativo radial */}
          <div className="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

          {/* Avatar del Robot */}
          <div className="relative flex-shrink-0">
            <div className="w-24 h-24 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 animate-float glow-effect border border-indigo-300/40">
              <svg className="w-14 h-14 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="11" width="18" height="10" rx="2" />
                <circle cx="12" cy="5" r="2" />
                <path d="M12 7v4" />
                <line x1="8" y1="15" x2="8" y2="15.01" strokeWidth="3" strokeLinecap="round" />
                <line x1="16" y1="15" x2="16" y2="15.01" strokeWidth="3" strokeLinecap="round" />
                <path d="M9 18c1.5 1 4.5 1 6 0" />
              </svg>
            </div>
            <span className="absolute -bottom-2 right-0 bg-emerald-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider border border-emerald-300 shadow">
              En Vivo
            </span>
          </div>

          {/* Bocadillo de Texto del Robot */}
          <div className="flex-1 space-y-2 text-center md:text-left">
            <div className="flex items-center justify-center md:justify-start space-x-2">
              <span className="text-xs font-extrabold uppercase tracking-widest text-indigo-400 bg-indigo-950/80 px-2.5 py-1 rounded-md border border-indigo-500/30">
                TuProfe20 Bot
              </span>
              <span className="text-xs text-slate-400">
                Paso {currentStepIndex + 1} de {totalSteps}
              </span>
            </div>
            <h4 className="text-base font-bold text-slate-100">
              {currentStepData ? currentStepData.stepTitle : "¡Selecciona un paso para comenzar!"}
            </h4>
            <p className="text-sm text-slate-300 leading-relaxed">
              {currentStepData ? currentStepData.explanation : "Te guiaré paso a paso explicándote la lógica matemática involucrada."}
            </p>
          </div>
        </div>
      );
    };

    // --- COMPONENTE PRINCIPAL (APP) ---
    function App() {
      const [activeChallengeIndex, setActiveChallengeIndex] = useState(0);
      const [currentStepIndex, setCurrentStepIndex] = useState(0);

      const challenge = challengesData[activeChallengeIndex];

      // Cambiar de reto
      const handleSelectChallenge = (index) => {
        sfx.playSwoosh();
        setActiveChallengeIndex(index);
        setCurrentStepIndex(0);
      };

      // Control de pasos
      const nextStep = () => {
        if (currentStepIndex < challenge.steps.length - 1) {
          sfx.playPop();
          setCurrentStepIndex(prev => prev + 1);
        } else {
          // Si llega al final del reto
          sfx.playFanfare();
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 80,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
        }
      };

      const prevStep = () => {
        if (currentStepIndex > 0) {
          sfx.playPop();
          setCurrentStepIndex(prev => prev - 1);
        }
      };

      return (
        <div className="min-h-screen pb-16 flex flex-col">
          {/* HEADER PRINCIPAL */}
          <header className="glass-panel border-b border-indigo-500/20 sticky top-0 z-50 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-indigo-500/40">
                  20
                </div>
                <div>
                  <h1 className="text-xl font-black tracking-tight text-white flex items-center gap-2">
                    TuProfe20 Lab <span className="text-indigo-400 font-normal text-sm sm:text-base">| Productos Notables</span>
                  </h1>
                  <p className="text-xs text-slate-400">Resolución guiada paso a paso con álgebra interactiva</p>
                </div>
              </div>

              {/* Indicador de Progreso General */}
              <div className="flex items-center space-x-2 bg-slate-900/80 px-4 py-1.5 rounded-full border border-indigo-500/30">
                <span className="text-xs font-semibold text-slate-300">Progreso:</span>
                <span className="text-xs font-bold text-indigo-400">{activeChallengeIndex + 1} / {challengesData.length} Retos</span>
              </div>
            </div>
          </header>

          {/* CONTENIDO PRINCIPAL EN GRID */}
          <main className="max-w-7xl mx-auto w-full px-4 pt-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* PANEL IZQUIERDO: SELECCIÓN DE RETOS (4 COLS) */}
            <aside className="lg:col-span-4 space-y-4">
              <div className="glass-panel rounded-2xl p-4 border border-indigo-500/20">
                <h3 className="text-sm font-extrabold uppercase tracking-wider text-indigo-400 mb-3 flex items-center justify-between">
                  <span>Lista de Retos</span>
                  <span className="text-xs bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded border border-indigo-800">12 Ejercicios</span>
                </h3>

                <div className="grid grid-cols-1 gap-2 max-h-[460px] overflow-y-auto custom-scrollbar pr-1">
                  {challengesData.map((item, idx) => {
                    const isActive = idx === activeChallengeIndex;
                    return (
                      <button
                        key={item.id}
                        onClick={() => handleSelectChallenge(idx)}
                        className={`w-full p-3 rounded-xl text-left transition-all flex items-center justify-between border ${
                          isActive
                            ? 'bg-gradient-to-r from-indigo-600/90 to-violet-600/90 border-indigo-400 text-white shadow-lg shadow-indigo-600/30 translate-x-1'
                            : 'bg-slate-900/60 hover:bg-slate-800/80 border-slate-700/50 text-slate-300 hover:border-slate-600'
                        }`}
                      >
                        <div className="flex items-center space-x-3 overflow-hidden">
                          <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs flex-shrink-0 ${
                            isActive ? 'bg-white text-indigo-900' : 'bg-slate-800 text-slate-400'
                          }`}>
                            {idx + 1}
                          </span>
                          <div className="truncate">
                            <span className="text-[11px] block text-indigo-200 font-semibold">{item.originalLabel}</span>
                            <div className="truncate text-sm font-bold">
                              <MathTex math={item.statement} />
                            </div>
                          </div>
                        </div>
                        {isActive && (
                          <div className="w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-1"></div>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* TARJETAS DE FÓRMULAS E IDENTIDADES */}
              <div className="space-y-3">
                <h4 className="text-xs font-extrabold uppercase tracking-wider text-slate-400 px-1">
                  Fórmulas de Apoyo
                </h4>
                <InteractiveFormulaCard
                  title="Binomio al Cuadrado (Suma)"
                  formula="(a + b)^2 = a^2 + 2ab + b^2"
                  description="El cuadrado del primer término, más el doble producto del primero por el segundo, más el cuadrado del segundo término."
                />
                <InteractiveFormulaCard
                  title="Binomio al Cuadrado (Resta)"
                  formula="(a - b)^2 = a^2 - 2ab + b^2"
                  description="El cuadrado del primer término, menos el doble producto del primero por el segundo, más el cuadrado del segundo término."
                />
                <InteractiveFormulaCard
                  title="1ª Identidad de Legendre"
                  formula="(a + b)^2 + (a - b)^2 = 2(a^2 + b^2)"
                  description="Simplifica la suma de los cuadrados de un binomio suma y un binomio diferencia con los mismos términos."
                />
              </div>
            </aside>

            {/* PANEL DERECHO: DESARROLLO DEL RETO SELECCIONADO (8 COLS) */}
            <section className="lg:col-span-8 space-y-6 flex flex-col">
              
              {/* ENCABEZADO DEL RETO ACTUAL */}
              <div className="glass-panel rounded-2xl p-6 border border-indigo-500/30 relative overflow-hidden">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-700/60 pb-4 mb-4">
                  <div>
                    <span className="text-xs font-extrabold text-indigo-400 uppercase tracking-widest bg-indigo-950/80 px-3 py-1 rounded-md border border-indigo-500/30">
                      {challenge.originalLabel}
                    </span>
                    <h2 className="text-2xl font-black text-white mt-2">
                      {challenge.title}
                    </h2>
                  </div>
                  <div className="bg-slate-950/90 px-4 py-3 rounded-xl border border-indigo-500/30 text-center flex-shrink-0">
                    <span className="text-[10px] uppercase font-bold text-slate-400 block mb-1">Enunciado</span>
                    <MathTex math={challenge.statement} inline={false} className="text-2xl font-bold text-indigo-300" />
                  </div>
                </div>

                {/* FORMULA DE REFERENCIA Y VARIABLES */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                  <div>
                    <span className="text-[11px] font-semibold text-slate-400 block">Fórmula a usar:</span>
                    <MathTex math={challenge.formulaKatex} className="text-indigo-300 font-bold text-sm" />
                  </div>
                  <div className="flex items-center space-x-3">
                    <span className="text-[11px] font-semibold text-slate-400">Variables:</span>
                    <div className="flex gap-2">
                      {challenge.variables.map((v, i) => (
                        <span key={i} className="bg-slate-800 px-2.5 py-0.5 rounded border border-slate-700 text-xs text-slate-200">
                          <MathTex math={`${v.name} = ${v.value}`} />
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>

              {/* ROBOT ASISTENTE */}
              <RobotAssistant
                currentStepData={challenge.steps[currentStepIndex]}
                totalSteps={challenge.steps.length}
                currentStepIndex={currentStepIndex}
              />

              {/* DESARROLLO GRANULAR PASO A PASO ACUMULATIVO */}
              <div className="glass-panel rounded-2xl p-6 border border-indigo-500/30 flex-1 flex flex-col justify-between space-y-6">
                <div>
                  <h3 className="text-sm font-extrabold text-slate-300 uppercase tracking-wider mb-4 flex items-center space-x-2">
                    <svg className="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Pasos de la Resolución Continua</span>
                  </h3>

                  <div className="space-y-3">
                    {challenge.steps.map((s, idx) => {
                      const isVisible = idx <= currentStepIndex;
                      const isCurrent = idx === currentStepIndex;

                      if (!isVisible) return null;

                      return (
                        <div
                          key={idx}
                          className={`p-4 rounded-xl border transition-all duration-300 ${
                            isCurrent
                              ? 'bg-indigo-950/70 border-indigo-400/80 shadow-lg shadow-indigo-950/50 scale-[1.01]'
                              : 'bg-slate-900/40 border-slate-800 opacity-75'
                          }`}
                        >
                          <div className="flex items-start justify-between gap-3">
                            <div className="flex items-center space-x-3">
                              <span className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${
                                isCurrent ? 'bg-indigo-500 text-white' : 'bg-slate-800 text-slate-400'
                              }`}>
                                {idx + 1}
                              </span>
                              <span className="font-bold text-sm text-slate-200">
                                {s.stepTitle}
                              </span>
                            </div>
                          </div>

                          <div className="mt-3 pl-9 overflow-x-auto">
                            <div className="p-3 bg-slate-950/80 rounded-lg border border-slate-800/80 inline-block min-w-full sm:min-w-0">
                              <MathTex math={s.katex} inline={false} className="text-lg font-semibold text-emerald-300" />
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* BOTONES DE NAVEGACIÓN ENTRE PASOS */}
                <div className="pt-4 border-t border-slate-800 flex items-center justify-between gap-4">
                  <button
                    onClick={prevStep}
                    disabled={currentStepIndex === 0}
                    className={`px-5 py-2.5 rounded-xl font-bold text-sm flex items-center space-x-2 transition-all ${
                      currentStepIndex === 0
                        ? 'opacity-40 cursor-not-allowed bg-slate-800 text-slate-500'
                        : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600'
                    }`}
                  >
                    <span>← Paso Anterior</span>
                  </button>

                  <div className="text-xs text-slate-400 font-semibold hidden sm:block">
                    Paso {currentStepIndex + 1} / {challenge.steps.length}
                  </div>

                  <button
                    onClick={nextStep}
                    className={`px-6 py-2.5 rounded-xl font-bold text-sm flex items-center space-x-2 shadow-lg transition-all ${
                      currentStepIndex === challenge.steps.length - 1
                        ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/50'
                        : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-900/50'
                    }`}
                  >
                    <span>
                      {currentStepIndex === challenge.steps.length - 1
                        ? '¡Reto Completado! 🎉'
                        : 'Siguiente Paso →'}
                    </span>
                  </button>
                </div>
              </div>

            </section>
          </main>
        </div>
      );
    }

    // RENDER REACT APP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
